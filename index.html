<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ネット証券 | キャンペーン一覧</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1 class="header__title">大手ネット証券</h1>
  </header>

  <main class="container">
    <main class="container">
    <h2 class="page-title">実施中のキャンペーン情報</h2>

    <!-- カテゴリ切り替えタブ -->
    <div class="tab-menu">
      <button class="tab-btn is-active" data-category="all">すべて</button>
      <button class="tab-btn" data-category="nisa">NISA</button>
      <button class="tab-btn" data-category="us-stock">米国株</button>
    </div>

    <!-- 1つ目のカード（data-category="nisa" を追加） -->
    <div class="card" data-category="nisa">
      <span class="card__badge">人気</span>
      <h3 class="card__title">新NISA応援！投信積立ポイント還元</h3>
      <p class="card__text">期間中に新NISA口座で対象の投資信託を積立設定すると、ポイント最大2.5%還元！</p>
      <div class="card__meta">
        <span class="card__date">期間：2026年10月1日〜2026年11月30日</span>
      </div>
      <div class="card__countdown" id="nisa-countdown"></div>
      <a href="#" class="btn btn--primary">詳細を見る</a>
    </div>

    <!-- 2つ目のカード（data-category="us-stock" を追加） -->
    <div class="card" data-category="us-stock">
      <span class="card__badge">限定</span>
      <h3 class="card__title">米国株 取引手数料実質0円キャンペーン</h3>
      <p class="card__text">期間中にエントリーし、対象の米国株式を購入すると、取引手数料を全額キャッシュバック！</p>
      <div class="card__meta">
        <span class="card__date">期間：2026年11月1日〜2026年11月30日</span>
      </div>
      <a href="#" class="btn btn--primary">詳細を見る</a>
    </div>
  </main>
  <section class="form-section">
  <h2>口座開設クイック申込</h2>
  <form id="signup-form" novalidate>
    <div class="form-group">
      <label for="username">お名前</label>
      <input type="text" id="username" name="username" placeholder="例：証券 太郎">
      <p class="error-message" id="name-error"></p>
    </div>
    <div class="form-group">
      <label for="email">メールアドレス</label>
      <input type="email" id="email" name="email" placeholder="example@example.com">
      <p class="error-message" id="email-error"></p>
    </div>
    <button type="submit" class="submit-btn">送信する</button>
  </form>
</section>
    <!-- 今後ここに新しいキャンペーンを追加していきます -->
    <!-- 2つ目のキャンペーンカード -->
    

  <script src="main.js"></script>
</body>
</html>
